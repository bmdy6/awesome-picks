name: Check collection
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate fields and generated README
        run: python scripts/build_readme.py --check
      - name: Regenerate and compare
        run: |
          python scripts/build_readme.py
          git diff --exit-code -- README.md
